  "families": {
    "main_night": {
      "go_type": "CompletedNightSleep",
      "owner": "internal/health/completed_night_sleep.go",
      "producer": "CanonicalizeCompletedNight",
      "grain": "wake_date",
      "method": "canonical single main-night row; capture and finality are independent",
      "quality": "positive plausible duration; claim eligibility controls historical use",
      "consumers": ["Sleep", "morning report", "Health MCP"],
      "parents": ["night_sleep_total"],
      "source_keys": ["CompletedNightSleep"],
      "fields": {
        "duration_hours": {"field": "DurationHours", "units": ["hr"], "value_type": "number"},
        "capture_completeness": {"field": "CaptureCompleteness", "units": ["category"], "value_type": "text"},
        "duration_assessment": {"field": "DurationAssessment", "units": ["category"], "value_type": "text"},
        "finalization_state": {"field": "FinalizationState", "units": ["category"], "value_type": "text"},
        "claim_eligibility": {"field": "ClaimEligibility", "units": ["category"], "value_type": "text"},
        "observed_at": {"field": "ObservedAt", "units": ["timestamp"], "value_type": "timestamp"},
        "finalized_at": {"field": "FinalizedAt", "units": ["timestamp"], "value_type": "timestamp"},
        "covered_interval_start": {"field": "CoveredIntervalStart", "units": ["timestamp"], "value_type": "timestamp", "method": "start of declared collection coverage; never an inferred episode start"},
        "covered_interval_end": {"field": "CoveredIntervalEnd", "units": ["timestamp"], "value_type": "timestamp", "method": "end of declared collection coverage; never an inferred episode end"}
      },
      "ignored_fields": ["WakeDate", "Source", "SourceEpoch", "InputHash", "AlgorithmVersion", "CoverageGeneration"]
    },
    "sleep_comparison": {
      "go_type": "SleepDurationComparison",
      "owner": "internal/health/sleep_duration_comparison.go",
      "producer": "NewSleepDurationComparison / SetDurations",
      "grain": "wake_date",
      "method": "round each duration in minutes, then subtract the rounded reference",
      "quality": "complete/plausible current night plus qualified historical reference",
      "consumers": ["Sleep", "morning report", "Health MCP"],
      "parents": ["main_night.duration_hours", "sleep_duration_reference_v1"],
      "source_keys": ["SleepDurationComparison"],
      "fields": {
        "status": {"field": "Status", "units": ["category"], "value_type": "text"},
        "duration_minutes": {"field": "DurationMinutes", "units": ["min"], "value_type": "integer"},
        "eligible_nights": {"field": "EligibleNights", "units": ["count"], "value_type": "integer"},
        "reference_minutes": {"field": "ReferenceMinutes", "units": ["min"], "value_type": "integer"},
        "delta_minutes": {"field": "DeltaMinutes", "units": ["min"], "value_type": "integer"}
      },
      "ignored_fields": ["WakeDate", "Source", "Capture", "Assessment", "Finalization", "WindowStart", "WindowEndExclusive", "RuleVersion", "ObservedAt", "FactVersion"]
    },
    "sleep_goal": {
      "go_type": "SleepGoal",
      "owner": "internal/health/sleep_duration_balance.go",
      "producer": "ValidateSleepGoal",
      "grain": "effective_date × version",
      "method": "dated manual target",
      "quality": "3–14 hours; effective local date",
      "consumers": ["Sleep balance"],
      "parents": [],
      "source_keys": ["SleepGoal"],
      "fields": {"hours": {"field": "Hours", "units": ["hr"], "value_type": "number"}},
      "ignored_fields": ["EffectiveDate", "Version"]
    },
    "sleep_balance_day": {
      "go_type": "SleepDurationBalancePeriod",
      "owner": "internal/health/sleep_duration_balance.go",
      "producer": "CalculateSleepDurationBalance",
      "grain": "wake_date × noon-to-noon period",
      "method": "sum source-selected non-overlapping episode durations in the period against effective goal",
      "quality": "complete explicit capture; recorded zero is meaningful",
      "consumers": ["Sleep balance"],
      "parents": ["sleep_goal.hours"],
      "source_keys": ["SleepDurationBalancePeriod"],
      "fields": {
        "goal_hours": {"field": "GoalHours", "units": ["hr"], "value_type": "number"},
        "total_sleep_hours": {"field": "TotalSleepHours", "units": ["hr"], "value_type": "number"},
        "delta_hours": {"field": "DeltaHours", "units": ["hr"], "value_type": "number"},
        "capture_state": {"field": "CaptureState", "units": ["category"], "value_type": "text"},
        "duration_assessment": {"field": "DurationAssessment", "units": ["category"], "value_type": "text"}
      },
      "ignored_fields": ["WakeDate", "Start", "End"]
    },
    "sleep_balance": {
      "go_type": "SleepDurationBalance",
      "owner": "internal/health/sleep_duration_balance.go",
      "producer": "CalculateSleepDurationBalance",
      "grain": "wake_date × trailing 14 periods",
      "method": "sum signed difference across complete periods",
      "quality": "nil until all 14 periods and goals covered",
      "consumers": ["Sleep balance", "Health MCP"],
      "parents": ["sleep_balance_day.delta_hours"],
      "source_keys": ["SleepDurationBalance"],
      "fields": {
        "state": {"field": "State", "units": ["category"], "value_type": "text"},
