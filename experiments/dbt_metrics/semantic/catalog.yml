    },
    "sleep_summary": {
      "go_type": "SleepAnalysis",
      "owner": "internal/health/types.go",
      "producer": "internal/health/sleep.go",
      "grain": "report date × available recent history",
      "method": "source-selected series; duration/stage averages have independent inputs",
