{
  "schema_version": 1,
  "description": "Local contract inventory. Each family field is a separate definition; field settings override family settings. Catalog version is independent of producer formula and row version.",
  "observation_defaults": {
    "version": 1,
    "value_type": "number",
    "clock": "retain original timestamp and offset; bucket dates use source semantics",
    "coverage": "per adapter; presence of a bucket or point does not prove interval coverage",
    "status": "inventory_only",
    "parents": [],
    "source_keys": [],
    "reduction": "none across rows without a separate definition",
    "grain": "metric_name × original date string × source, input time resolution depends on channel",
    "owner": "internal/storage/db.go"
  },
  "derived_defaults": {
    "version": 1,
    "value_type": "number",
    "clock": "profile-local calendar; actual instants in UTC",
    "coverage": "missing stays unavailable; inspect producer eligibility",
    "status": "inventory_only",
    "parents": [],
    "source_keys": [],
    "reduction": "none across rows without a separate definition"
  },
  "units": ["%", "IU", "L", "L/min", "MET", "W", "boolean", "bouts_per_hour", "bpm", "category", "channel_unit", "cm", "coefficient", "component_unit", "count", "count/hr", "count/min", "dBASPL", "date", "day", "degC", "duration", "ft/s", "g", "hr", "kcal", "kcal/hr·kg", "kg", "km", "km/hr", "m", "m/s", "mL", "mL/kg/min", "mL/kg·min", "mcg", "mg", "mg/dL", "min", "mixed", "mmHg", "ms", "pct", "probability", "ratio", "rpm", "s", "score", "steps/min", "target_unit", "timestamp", "unknown", "version", "z", "z_hour"],
  "source_policy": {
    "xml": "Explicit mapping denotes the parser fallback unit. XML can supply another unit. Check the stored units before reduction. Sleep category durations are computed from original start/end; quantity importer stores start timestamps.",
    "ios": "Declared outgoing serverUnits; sample_start is the start timestamp of an individual quantity sample. hour_sum is the start of an HKStatisticsCollectionQuery bucket. Category events and coarse/staged/total sleep have separate semantics.",
    "generic": "Key and device names alone do not establish sensor method, epoch or temporal resolution. Do not infer RMSSD or SDNN, or promote an hourly value to an event.",
    "quality": "Named ranges are inclusive bounds from health.IsImpossible. Missing range means no range-specific validation. Each derived consumer enforces its own filter.",
    "roles": "Unit aliases are retained by channel, including divergent scales. Never aggregate across differing units until a versioned conversion is verified. Monitoring/evidence fields have value_type and grain like numeric metrics.",
    "unknown": "Unknown keys preserve original name, units and aggregate inventory counts. Unknown units and unresolved aliases stay unpublished. Omitted parents in inventory-only families indicate lineage not exhaustively established. Family parents are domain inputs; fields preserve producer-specific dependencies.",
    "time": "Extraction grain is per profile. Row clocks, provenance, nullable values, epoch and formula versions propagate from the source. Family groupings may include diagnostic values and evidence, but never store a narrative or identity as a numerical fact."
  },
