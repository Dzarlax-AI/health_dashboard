{{define "score-gauge"}}
<div class="score-gauge score-gauge--{{.Tone}}" aria-label="{{.AriaLabel}}">
  <div class="score-gauge__frame">
    <svg class="score-gauge__svg"
         viewBox="0 0 120 120"
         preserveAspectRatio="xMidYMid meet"
         aria-hidden="true"
         focusable="false">
      <circle class="score-gauge__track" cx="60" cy="60" r="50"></circle>
      <circle class="score-gauge__progress"
              cx="60"
              cy="60"
              r="50"
              pathLength="100"
              stroke-dasharray="{{.Value}} 100"
              transform="rotate(-90 60 60)"></circle>
    </svg>
    <div class="score-gauge__content">
      <span class="score-gauge__value">{{.Value}}<small>%</small></span>
    </div>
  </div>
  <div class="score-gauge__label">{{.Label}}</div>
  {{if .Status}}<div class="score-gauge__status">{{.Status}}</div>{{end}}
  {{if .Subline}}<div class="score-gauge__subline">{{.Subline}}</div>{{end}}
</div>
{{end}}
