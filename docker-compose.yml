services:
  health-receiver:
    # Production deployments must set HEALTH_IMAGE to an immutable digest.
    image: ${HEALTH_IMAGE:-ghcr.io/dzarlax-ai/health_dashboard:latest}
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://health:health@postgres:5432/health
      # - API_KEY=your-secret-key
      # - UI_PASSWORD=your-ui-password
      # - TRUST_FORWARD_AUTH=true  # enable if behind Authentik/ForwardAuth proxy
      # - TRUSTED_FORWARD_AUTH_NETWORK=172.16.0.0/12  # proxy CIDR if not using the default private/loopback trust rule
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: health
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
