name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_amd64:
        description: "Build AMD64 image"
        type: boolean
        default: true
      build_arm64:
        description: "Build ARM64 image"
        type: boolean
        default: false
      run_race:
        description: "Run Go race detector tests"
        type: boolean
        default: false
      db_test_lane:
        description: "Additional DB lane selection for manual runs"
        type: choice
        default: stable
        options:
          - stable
          - routine
          - ui
          - energy
          - readiness
          - storage

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    name: Build, Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all binaries
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      # Unit tests. DB-backed integration tests are gated by
      # HEALTH_DB_TESTS=1 and skip in this job even if libpq environment
      # variables happen to exist. The separate DB Tests job runs the
      # stable DB lanes with an isolated Postgres service on PR/push.
      #
      # CGO_ENABLED stays at 0 (matches the build above). Use the
      # manual Race Detector job when reviewing concurrency-sensitive
      # changes; it runs with CGO=1 because Go's -race requires CGO.
      - name: Test
        run: make test-unit

      - name: Test tenant schema release gate scripts
        run: |
          bash -n scripts/deploy-tenant-schema-gate.sh scripts/deploy-tenant-schema-gate_test.sh
          bash scripts/deploy-tenant-schema-gate_test.sh

  db-tests:
    name: DB Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: health_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d health_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HEALTH_DB_TESTS: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: health_test
      PGUSER: postgres
      PGPASSWORD: postgres
      REGISTRY_TEST_DSN: postgres://registry_ci:registry_ci@localhost:5432/health_test
      GOCACHE: /tmp/health-go-build-cache
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare disposable security-test database
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.health_test_metadata(key text primary key, value text not null)"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.health_test_metadata(key,value) VALUES ('disposable_database','true') ON CONFLICT(key) DO UPDATE SET value=excluded.value"
          psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='registry_ci') THEN CREATE ROLE registry_ci LOGIN PASSWORD 'registry_ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; END IF; END \$\$"
          psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS health_registry AUTHORIZATION registry_ci"
          psql -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE health_test TO registry_ci"
          psql -v ON_ERROR_STOP=1 -c "GRANT SELECT ON public.health_test_metadata TO registry_ci"

      - name: Run tenant isolation DB lane
        run: make test-db-security

      - name: Run import and durable-delivery DB lane
        run: make test-db-import

      - name: Run routine DB lane
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.db_test_lane == 'stable' || inputs.db_test_lane == 'routine' }}
        run: make test-db

      - name: Run full UI DB lane
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.db_test_lane == 'stable' || inputs.db_test_lane == 'ui' }}
        run: make test-db-ui

      - name: Run full Energy DB lane
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.db_test_lane == 'stable' || inputs.db_test_lane == 'energy' }}
        run: make test-db-energy

      - name: Run Readiness DB lane
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.db_test_lane == 'readiness' }}
        run: make test-db-readiness

      - name: Run full Storage DB lane
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.db_test_lane == 'storage' }}
        run: make test-db-storage

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_race }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race ./...

  container-smoke:
    name: Container Smoke & Restart
    needs: [build, db-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build runtime image
        run: docker build -t health-dashboard:ci .

      - name: Verify runtime image contract
        run: docker run --rm --entrypoint /bin/sh health-dashboard:ci -c 'test -x /app/server && test -x /app/tenant_isolation && test "$(id -u)" -ne 0'

      - name: Start disposable stack and verify restart recovery
        run: |
          docker network create health-ci
          docker run -d --name health-ci-db --network health-ci -e POSTGRES_DB=health -e POSTGRES_USER=health -e POSTGRES_PASSWORD=health postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          for i in $(seq 1 30); do docker exec health-ci-db pg_isready -U health -d health && break; sleep 1; done
          docker run -d --name health-ci-app --network health-ci -p 18080:8080 -e DATABASE_URL='postgres://health:health@health-ci-db:5432/health?search_path=health' -e API_KEY=ci-key -e UI_PASSWORD=ci-password health-dashboard:ci
          for i in $(seq 1 60); do curl --fail --silent http://localhost:18080/readyz && break; sleep 1; done
          curl --fail --silent http://localhost:18080/readyz
          curl --fail --silent -X POST http://localhost:18080/health -H 'X-API-Key: ci-key' -H 'Content-Type: application/json' -d '{"data":{"metrics":[{"name":"step_count","units":"count","data":[{"date":"2026-07-12 10:00:00 +0000","qty":1234,"source":"CI Phone"}]}]}}'
          docker kill --signal=TERM health-ci-app
          docker wait health-ci-app
          docker rm health-ci-app
          docker run -d --name health-ci-app --network health-ci -p 18080:8080 -e DATABASE_URL='postgres://health:health@health-ci-db:5432/health?search_path=health' -e API_KEY=ci-key -e UI_PASSWORD=ci-password health-dashboard:ci
          for i in $(seq 1 60); do curl --fail --silent http://localhost:18080/readyz && break; sleep 1; done
          curl --fail --silent http://localhost:18080/readyz
          recovered=0
          for i in $(seq 1 30); do
            if test "$(docker exec health-ci-db psql -U health -d health -Atc "SELECT count(*) FROM health.metric_points WHERE metric_name='step_count' AND qty=1234")" = "1"; then recovered=1; break; fi
            sleep 1
          done
          test "$recovered" = "1"

  docker-amd64:
    name: Docker Build & Push (amd64)
    needs: [build, db-tests, container-smoke]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_amd64)) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  docker-arm64:
    name: Docker Build & Push (arm64)
    needs: [build, db-tests, container-smoke]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.build_arm64 }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch
