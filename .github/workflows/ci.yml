name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_amd64:
        description: "Build AMD64 image"
        type: boolean
        default: true
      build_arm64:
        description: "Build ARM64 image"
        type: boolean
        default: false
      run_race:
        description: "Run Go race detector tests"
        type: boolean
        default: false
      db_test_lane:
        description: "Additional DB lane selection for manual runs"
        type: choice
        default: stable
        options:
          - stable
          - routine
          - ui
          - energy
          - readiness
          - storage

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'health-dashboard-main-release' || format('health-dashboard-ci-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  classify-image-changes:
    name: Classify Image Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          changed_paths="$RUNNER_TEMP/changed-paths.txt"
          : > "$changed_paths"

          if printf '%s\n' "$DIFF_BASE" | grep -Eq '^[0-9a-f]{40}$' &&
            test "$DIFF_BASE" != 0000000000000000000000000000000000000000 &&
            git cat-file -e "$DIFF_BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$DIFF_BASE" "$GITHUB_SHA" > "$changed_paths" || : > "$changed_paths"
          fi

          ./scripts/classify-image-changes.sh < "$changed_paths" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build, Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all binaries
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      # Unit tests. DB-backed integration tests are gated by
      # HEALTH_DB_TESTS=1 and skip in this job even if libpq environment
      # variables happen to exist. The separate DB Tests job runs the
      # stable DB lanes with an isolated Postgres service on PR/push.
      #
      # CGO_ENABLED stays at 0 (matches the build above). Use the
      # manual Race Detector job when reviewing concurrency-sensitive
      # changes; it runs with CGO=1 because Go's -race requires CGO.
      - name: Test
        run: make test-unit

      - name: Verify client API contract
        run: make contract-check

      - name: Test tenant schema release gate scripts
        run: |
          bash -n scripts/deploy-tenant-schema-gate.sh scripts/deploy-tenant-schema-gate_test.sh
          bash scripts/deploy-tenant-schema-gate_test.sh

      - name: Test release contract helpers
        run: make test-release-contract-helpers

  web:
    name: Web Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: make web-check

      - name: Install Playwright browser dependencies
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Test responsive score geometry
        run: make web-test-visual

  db-tests:
    name: DB Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: health_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d health_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HEALTH_DB_TESTS: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: health_test
      PGUSER: postgres
      PGPASSWORD: postgres
      GOCACHE: /tmp/health-go-build-cache
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare disposable security-test database
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.health_test_metadata(key text primary key, value text not null)"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.health_test_metadata(key,value) VALUES ('disposable_database','true') ON CONFLICT(key) DO UPDATE SET value=excluded.value"

      # Keep DB_IDENTITY_TEST_DSN step-local. The lifecycle test is destructive
      # by design and must not run again as part of the full tenant package.
      - name: Run PostgreSQL 16 database identity lifecycle
        env:
          DB_IDENTITY_TEST_DSN: postgres://postgres:postgres@localhost:5432/health_test
        run: |
          set -o pipefail
          lifecycle_output="$RUNNER_TEMP/database-identity-lifecycle.txt"
          go test ./internal/tenants -run '^TestDatabaseIdentityTemporaryPrivilegeFlow$' -count=1 -timeout=120s -v | tee "$lifecycle_output"
          grep -F -- '--- PASS: TestDatabaseIdentityTemporaryPrivilegeFlow ' "$lifecycle_output"

      - name: Bootstrap fixed database identities
        run: |
          admin_password="$(openssl rand -hex 32)"
          registry_password="$(openssl rand -hex 32)"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$registry_password"

          identity_bin="$RUNNER_TEMP/tenant_isolation"
          identity_manifest="$RUNNER_TEMP/health-db-identity-manifest.json"
          go build -o "$identity_bin" ./cmd/tenant_isolation

          TENANT_DB_BOOTSTRAP_DATABASE_URL='postgres://postgres:postgres@localhost:5432/health_test' \
          HEALTH_ADMIN_DB_PASSWORD="$admin_password" \
          HEALTH_REGISTRY_DB_PASSWORD="$registry_password" \
            "$identity_bin" --mode bootstrap-db-identities --manifest "$identity_manifest" --confirm

          # The registry integration tests independently enforce this marker
          # before they perform destructive fixture setup.
          psql -v ON_ERROR_STOP=1 -c "GRANT SELECT ON public.health_test_metadata TO health_admin,health_registry"

          {
            echo "ADMIN_TEST_DSN=postgres://health_admin:${admin_password}@localhost:5432/health_test"
            echo "REGISTRY_TEST_DSN=postgres://health_registry:${registry_password}@localhost:5432/health_test"
            echo "DB_IDENTITY_MANIFEST=$identity_manifest"
          } >> "$GITHUB_ENV"

      - name: Run tenant isolation DB lane
        run: make test-db-security

      - name: Verify fixed identities after registry initialization
        run: |
          ADMIN_DATABASE_URL="$ADMIN_TEST_DSN" \
          REGISTRY_DATABASE_URL="$REGISTRY_TEST_DSN" \
            "$RUNNER_TEMP/tenant_isolation" --mode verify-db-identities

      - name: Run import and durable-delivery DB lane
        run: make test-db-import

      - name: Run routine DB lane
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.db_test_lane == 'stable' || inputs.db_test_lane == 'routine' }}
        run: make test-db

      - name: Run full UI DB lane
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.db_test_lane == 'stable' || inputs.db_test_lane == 'ui' }}
        run: make test-db-ui

      - name: Run full Energy DB lane
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.db_test_lane == 'stable' || inputs.db_test_lane == 'energy' }}
        run: make test-db-energy

      - name: Run Readiness DB lane
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.db_test_lane == 'readiness' }}
        run: make test-db-readiness

      - name: Run full Storage DB lane
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.db_test_lane == 'storage' }}
        run: make test-db-storage

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_race }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race ./...

  container-smoke:
    name: Container Smoke & Restart
    needs: [build, db-tests, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read API contract version
        run: echo "API_CONTRACT_VERSION=$(python3 -c 'import json; print(json.load(open("contracts/openapi.json"))["info"]["version"])')" >> "$GITHUB_ENV"

      - name: Build runtime image
        run: |
          docker build -f Dockerfile.backend \
            --build-arg BUILD_REVISION="$GITHUB_SHA" \
            --build-arg IMAGE_VERSION=ci \
            --build-arg API_CONTRACT_VERSION="$API_CONTRACT_VERSION" \
            -t health-dashboard:ci .
          docker build -f apps/web/Dockerfile \
            --build-arg BUILD_REVISION="$GITHUB_SHA" \
            --build-arg IMAGE_VERSION=ci \
            --build-arg API_CONTRACT_VERSION="$API_CONTRACT_VERSION" \
            -t health-frontend:ci .

      - name: Verify runtime image contract
        run: |
          BACKEND_IMAGE=health-dashboard:ci \
          FRONTEND_IMAGE=health-frontend:ci \
          BUILD_REVISION="$GITHUB_SHA" \
          IMAGE_VERSION=ci \
          API_CONTRACT_VERSION="$API_CONTRACT_VERSION" \
          ./scripts/test-container-images.sh

      - name: Reject both contract-mismatch directions before startup
        run: |
          BACKEND_IMAGE=health-dashboard:ci \
          FRONTEND_IMAGE=health-frontend:ci \
          BUILD_REVISION="$GITHUB_SHA" \
          API_CONTRACT_VERSION="$API_CONTRACT_VERSION" \
          ./scripts/test-compatible-image-pair-preflight.sh

      - name: Verify routed candidate image pair
        run: |
          BACKEND_IMAGE=health-dashboard:ci \
          FRONTEND_IMAGE=health-frontend:ci \
          BUILD_REVISION="$GITHUB_SHA" \
          API_CONTRACT_VERSION="$API_CONTRACT_VERSION" \
          ./scripts/test-compatible-image-pair.sh

      - name: Bootstrap blank database and verify isolated restart recovery
        run: |
          set -eu

          root_password="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 32)"
          registry_password="$(openssl rand -hex 32)"
          master_secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$root_password"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$registry_password"
          echo "::add-mask::$master_secret"

          cleanup() {
            status=$?
            if test "$status" -ne 0; then
              docker logs health-ci-db >&2 || true
            fi
            docker rm -f health-ci-app health-ci-db >/dev/null 2>&1 || true
            docker network rm health-ci >/dev/null 2>&1 || true
            return "$status"
          }
          trap cleanup EXIT

          manifest_dir="$RUNNER_TEMP/health-ci-identity"
          mkdir -p "$manifest_dir"
          chmod 0700 "$manifest_dir"
          manifest=/bootstrap/database-identity-manifest.json

          docker network create health-ci
          docker run -d --name health-ci-db --network health-ci \
            -e POSTGRES_DB=health -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD="$root_password" \
            postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          docker run --rm --network health-ci -e PGPASSWORD="$root_password" \
            postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193 \
            /bin/sh -ec '
              for i in $(seq 1 30); do
                if test "$(psql -h health-ci-db -U postgres -d health -Atc "SELECT 1" 2>/dev/null)" = "1"; then
                  exit 0
                fi
                sleep 1
              done
              exit 1
            '

          docker run --rm --user 0:0 --network health-ci -v "$manifest_dir:/bootstrap" \
            -e TENANT_DB_BOOTSTRAP_DATABASE_URL="postgres://postgres:${root_password}@health-ci-db:5432/health?sslmode=disable" \
            -e HEALTH_ADMIN_DB_PASSWORD="$admin_password" \
            -e HEALTH_REGISTRY_DB_PASSWORD="$registry_password" \
            --entrypoint /app/tenant_isolation health-dashboard:ci \
            --mode bootstrap-db-identities --manifest "$manifest" --confirm

          test -f "$manifest_dir/database-identity-manifest.json"
          test "$(stat -c '%u' "$manifest_dir/database-identity-manifest.json")" = "0"
          test "$(stat -c '%a' "$manifest_dir/database-identity-manifest.json")" = "600"

          docker run -d --name health-ci-app --network health-ci -p 18080:8080 \
            -e TENANT_DB_ISOLATION_ENABLED=true \
            -e ADMIN_DATABASE_URL="postgres://health_admin:${admin_password}@health-ci-db:5432/health" \
            -e REGISTRY_DATABASE_URL="postgres://health_registry:${registry_password}@health-ci-db:5432/health" \
            -e TENANT_DATABASE_URL_BASE='postgres://health-ci-db:5432/health?sslmode=disable' \
            -e TENANT_DB_MASTER_SECRET="$master_secret" \
            -e TENANT_DB_MASTER_SECRET_VERSION=1 \
            -e API_KEY=ci-key -e UI_PASSWORD=ci-password \
            health-dashboard:ci
          docker exec health-ci-app /bin/sh -c 'test -z "$TENANT_DB_BOOTSTRAP_DATABASE_URL"; case "$ADMIN_DATABASE_URL $REGISTRY_DATABASE_URL" in *postgres://postgres:*) exit 1;; esac'
          for i in $(seq 1 60); do curl --fail --silent http://localhost:18080/readyz && break; sleep 1; done
          curl --fail --silent http://localhost:18080/readyz

          docker run --rm --network health-ci \
            -e TENANT_DB_ISOLATION_ENABLED=true \
            -e ADMIN_DATABASE_URL="postgres://health_admin:${admin_password}@health-ci-db:5432/health" \
            -e REGISTRY_DATABASE_URL="postgres://health_registry:${registry_password}@health-ci-db:5432/health" \
            -e TENANT_DATABASE_URL_BASE='postgres://health-ci-db:5432/health?sslmode=disable' \
            -e TENANT_DB_MASTER_SECRET="$master_secret" \
            -e TENANT_DB_MASTER_SECRET_VERSION=1 \
            --entrypoint /app/tenant_isolation health-dashboard:ci \
            --mode migrate-contract --all --primary-schema health --confirm
          docker run --rm --network health-ci \
            -e TENANT_DB_ISOLATION_ENABLED=true \
            -e ADMIN_DATABASE_URL="postgres://health_admin:${admin_password}@health-ci-db:5432/health" \
            -e REGISTRY_DATABASE_URL="postgres://health_registry:${registry_password}@health-ci-db:5432/health" \
            -e TENANT_DATABASE_URL_BASE='postgres://health-ci-db:5432/health?sslmode=disable' \
            -e TENANT_DB_MASTER_SECRET="$master_secret" \
            -e TENANT_DB_MASTER_SECRET_VERSION=1 \
            --entrypoint /app/tenant_isolation health-dashboard:ci \
            --mode audit --all --primary-schema health

          docker run --rm --user 0:0 --network health-ci -v "$manifest_dir:/bootstrap" \
            -e TENANT_DB_BOOTSTRAP_DATABASE_URL="postgres://postgres:${root_password}@health-ci-db:5432/health" \
            --entrypoint /app/tenant_isolation health-dashboard:ci \
            --mode finalize-db-identities --manifest "$manifest" --confirm
          docker run --rm --network health-ci \
            -e ADMIN_DATABASE_URL="postgres://health_admin:${admin_password}@health-ci-db:5432/health" \
            -e REGISTRY_DATABASE_URL="postgres://health_registry:${registry_password}@health-ci-db:5432/health" \
            --entrypoint /app/tenant_isolation health-dashboard:ci \
            --mode verify-db-identities

          curl --fail --silent -X POST http://localhost:18080/health -H 'X-API-Key: ci-key' -H 'Content-Type: application/json' -d '{"data":{"metrics":[{"name":"step_count","units":"count","data":[{"date":"2026-07-12 10:00:00 +0000","qty":1234,"source":"CI Phone"}]}]}}'
          ingested=0
          for i in $(seq 1 30); do
            if test "$(docker exec -e PGPASSWORD="$root_password" health-ci-db psql -U postgres -d health -Atc "SELECT count(*) FROM health.metric_points WHERE metric_name='step_count' AND qty=1234")" = "1"; then ingested=1; break; fi
            sleep 1
          done
          test "$ingested" = "1"

          docker kill --signal=TERM health-ci-app
          docker wait health-ci-app
          docker rm health-ci-app
          docker run -d --name health-ci-app --network health-ci -p 18080:8080 \
            -e TENANT_DB_ISOLATION_ENABLED=true \
            -e ADMIN_DATABASE_URL="postgres://health_admin:${admin_password}@health-ci-db:5432/health" \
            -e REGISTRY_DATABASE_URL="postgres://health_registry:${registry_password}@health-ci-db:5432/health" \
            -e TENANT_DATABASE_URL_BASE='postgres://health-ci-db:5432/health?sslmode=disable' \
            -e TENANT_DB_MASTER_SECRET="$master_secret" \
            -e TENANT_DB_MASTER_SECRET_VERSION=1 \
            -e API_KEY=ci-key -e UI_PASSWORD=ci-password \
            health-dashboard:ci
          for i in $(seq 1 60); do curl --fail --silent http://localhost:18080/readyz && break; sleep 1; done
          curl --fail --silent http://localhost:18080/readyz
          recovered=0
          for i in $(seq 1 30); do
            if test "$(docker exec -e PGPASSWORD="$root_password" health-ci-db psql -U postgres -d health -Atc "SELECT count(*) FROM health.metric_points WHERE metric_name='step_count' AND qty=1234")" = "1"; then recovered=1; break; fi
            sleep 1
          done
          test "$recovered" = "1"

  docker-amd64:
    name: Docker Build & Push (amd64)
    needs: [classify-image-changes, build, db-tests, web, container-smoke]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      digest: ${{ steps.resolve.outputs.digest }}
      revision: ${{ steps.resolve.outputs.revision }}
      contract: ${{ steps.resolve.outputs.contract }}
      role: ${{ steps.resolve.outputs.role }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        if: ${{ needs.classify-image-changes.outputs.backend == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_amd64) }}
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Read API contract version
        id: contract
        run: echo "version=$(python3 -c 'import json; print(json.load(open("contracts/openapi.json"))["info"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64)
        id: build-push
        if: ${{ needs.classify-image-changes.outputs.backend == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_amd64) }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.backend
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            API_CONTRACT_VERSION=${{ steps.contract.outputs.version }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Resolve exact backend artifact
        id: resolve
        env:
          COMPONENT_CHANGED: ${{ needs.classify-image-changes.outputs.backend == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_amd64) }}
          PUBLISHED_DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          PAIR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-pair
          COMPONENT_KEY: backend
          EXPECTED_ROLE: backend
        run: ./scripts/resolve-release-image.sh

  docker-frontend-amd64:
    name: Frontend Docker Build & Push (amd64)
    needs: [classify-image-changes, build, db-tests, web, container-smoke]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      digest: ${{ steps.resolve.outputs.digest }}
      revision: ${{ steps.resolve.outputs.revision }}
      contract: ${{ steps.resolve.outputs.contract }}
      role: ${{ steps.resolve.outputs.role }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        if: ${{ needs.classify-image-changes.outputs.frontend == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_amd64) }}
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Read API contract version
        id: contract
        run: echo "version=$(python3 -c 'import json; print(json.load(open("contracts/openapi.json"))["info"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64)
        id: build-push
        if: ${{ needs.classify-image-changes.outputs.frontend == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_amd64) }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            API_CONTRACT_VERSION=${{ steps.contract.outputs.version }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-amd64
          cache-to: type=gha,mode=max,scope=frontend-amd64

      - name: Resolve exact frontend artifact
        id: resolve
        env:
          COMPONENT_CHANGED: ${{ needs.classify-image-changes.outputs.frontend == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_amd64) }}
          PUBLISHED_DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          PAIR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-pair
          COMPONENT_KEY: frontend
          EXPECTED_ROLE: frontend
        run: ./scripts/resolve-release-image.sh

  released-pair:
    name: Released Image Pair
    needs: [docker-amd64, docker-frontend-amd64]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify exact released artifacts
        env:
          BACKEND_IMAGE: ${{ needs.docker-amd64.outputs.image }}@${{ needs.docker-amd64.outputs.digest }}
          FRONTEND_IMAGE: ${{ needs.docker-frontend-amd64.outputs.image }}@${{ needs.docker-frontend-amd64.outputs.digest }}
          BACKEND_BUILD_REVISION: ${{ needs.docker-amd64.outputs.revision }}
          FRONTEND_BUILD_REVISION: ${{ needs.docker-frontend-amd64.outputs.revision }}
          BACKEND_CONTRACT: ${{ needs.docker-amd64.outputs.contract }}
          FRONTEND_CONTRACT: ${{ needs.docker-frontend-amd64.outputs.contract }}
        run: |
          set -eu
          docker pull --platform linux/amd64 "$BACKEND_IMAGE"
          docker pull --platform linux/amd64 "$FRONTEND_IMAGE"

          test "$BACKEND_CONTRACT" = "$FRONTEND_CONTRACT"
          BACKEND_IMAGE="$BACKEND_IMAGE" \
          FRONTEND_IMAGE="$FRONTEND_IMAGE" \
          BACKEND_BUILD_REVISION="$BACKEND_BUILD_REVISION" \
          FRONTEND_BUILD_REVISION="$FRONTEND_BUILD_REVISION" \
          API_CONTRACT_VERSION="$BACKEND_CONTRACT" \
          PAIR_PREFLIGHT_ONLY=1 \
          ./scripts/test-compatible-image-pair.sh

      - name: Verify routed released image pair
        env:
          BACKEND_IMAGE: ${{ needs.docker-amd64.outputs.image }}@${{ needs.docker-amd64.outputs.digest }}
          FRONTEND_IMAGE: ${{ needs.docker-frontend-amd64.outputs.image }}@${{ needs.docker-frontend-amd64.outputs.digest }}
          BACKEND_BUILD_REVISION: ${{ needs.docker-amd64.outputs.revision }}
          FRONTEND_BUILD_REVISION: ${{ needs.docker-frontend-amd64.outputs.revision }}
          API_CONTRACT_VERSION: ${{ needs.docker-amd64.outputs.contract }}
        run: ./scripts/test-compatible-image-pair.sh

      - name: Create compatibility manifest
        env:
          BACKEND_IMAGE: ${{ needs.docker-amd64.outputs.image }}
          FRONTEND_IMAGE: ${{ needs.docker-frontend-amd64.outputs.image }}
          BACKEND_DIGEST: ${{ needs.docker-amd64.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.docker-frontend-amd64.outputs.digest }}
          BACKEND_REVISION: ${{ needs.docker-amd64.outputs.revision }}
          FRONTEND_REVISION: ${{ needs.docker-frontend-amd64.outputs.revision }}
          API_CONTRACT_VERSION: ${{ needs.docker-amd64.outputs.contract }}
          BACKEND_ROLE: ${{ needs.docker-amd64.outputs.role }}
          FRONTEND_ROLE: ${{ needs.docker-frontend-amd64.outputs.role }}
        run: |
          set -eu
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ./scripts/create-compatibility-manifest.py \
            --backend-image "$BACKEND_IMAGE" \
            --frontend-image "$FRONTEND_IMAGE" \
            --backend-role "$BACKEND_ROLE" \
            --frontend-role "$FRONTEND_ROLE" \
            --backend-digest "$BACKEND_DIGEST" \
            --frontend-digest "$FRONTEND_DIGEST" \
            --pair-revision "$GITHUB_SHA" \
            --backend-revision "$BACKEND_REVISION" \
            --frontend-revision "$FRONTEND_REVISION" \
            --backend-contract-version "$API_CONTRACT_VERSION" \
            --frontend-contract-version "$API_CONTRACT_VERSION" \
            --created-at "$created_at" \
            > compatibility-manifest.json

      - name: Publish atomic compatibility pair pointer
        id: publish-pair
        env:
          PAIR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-pair
          BACKEND_IMAGE: ${{ needs.docker-amd64.outputs.image }}
          FRONTEND_IMAGE: ${{ needs.docker-frontend-amd64.outputs.image }}
          BACKEND_DIGEST: ${{ needs.docker-amd64.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.docker-frontend-amd64.outputs.digest }}
          BACKEND_REVISION: ${{ needs.docker-amd64.outputs.revision }}
          FRONTEND_REVISION: ${{ needs.docker-frontend-amd64.outputs.revision }}
          API_CONTRACT_VERSION: ${{ needs.docker-amd64.outputs.contract }}
        run: |
          set -eu
          PAIR_IMAGE="$(printf '%s' "$PAIR_IMAGE" | tr '[:upper:]' '[:lower:]')"
          pair_context="$RUNNER_TEMP/compatibility-pair-context"
          pair_metadata="$RUNNER_TEMP/compatibility-pair-build.json"
          extracted_manifest="$RUNNER_TEMP/extracted-compatibility-manifest.json"
          mkdir -p "$pair_context"
          cp compatibility-manifest.json "$pair_context/compatibility-manifest.json"

          docker buildx build \
            --provenance=false \
            --platform linux/amd64 \
            --file scripts/fixtures/compatibility-manifest.Dockerfile \
            --build-arg "PAIR_REVISION=$GITHUB_SHA" \
            --build-arg "API_CONTRACT_VERSION=$API_CONTRACT_VERSION" \
            --build-arg "BACKEND_IMAGE=$BACKEND_IMAGE" \
            --build-arg "BACKEND_DIGEST=$BACKEND_DIGEST" \
            --build-arg "BACKEND_REVISION=$BACKEND_REVISION" \
            --build-arg "FRONTEND_IMAGE=$FRONTEND_IMAGE" \
            --build-arg "FRONTEND_DIGEST=$FRONTEND_DIGEST" \
            --build-arg "FRONTEND_REVISION=$FRONTEND_REVISION" \
            --tag "$PAIR_IMAGE:$GITHUB_SHA" \
            --metadata-file "$pair_metadata" \
            --push \
            "$pair_context"

          pair_digest="$(
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$pair_metadata"
          )"
          printf '%s\n' "$pair_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          docker pull --platform linux/amd64 "$PAIR_IMAGE@$pair_digest"

          assert_pair_label() {
            label="$1"
            expected="$2"
            actual="$(docker image inspect --format "{{ index .Config.Labels \"$label\" }}" "$PAIR_IMAGE@$pair_digest")"
            test "$actual" = "$expected"
          }

          assert_pair_label io.health-dashboard.image-role compatibility-pair
          assert_pair_label io.health-dashboard.pair-revision "$GITHUB_SHA"
          assert_pair_label io.health-dashboard.api-contract-version "$API_CONTRACT_VERSION"
          assert_pair_label io.health-dashboard.backend-image "$BACKEND_IMAGE"
          assert_pair_label io.health-dashboard.backend-digest "$BACKEND_DIGEST"
          assert_pair_label io.health-dashboard.backend-revision "$BACKEND_REVISION"
          assert_pair_label io.health-dashboard.frontend-image "$FRONTEND_IMAGE"
          assert_pair_label io.health-dashboard.frontend-digest "$FRONTEND_DIGEST"
          assert_pair_label io.health-dashboard.frontend-revision "$FRONTEND_REVISION"

          pair_container="$(docker create "$PAIR_IMAGE@$pair_digest" /compatibility.json)"
          trap 'docker rm -f "$pair_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$pair_container:/compatibility.json" "$extracted_manifest"
          docker rm "$pair_container"
          pair_container=""
          cmp compatibility-manifest.json "$extracted_manifest"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$PAIR_IMAGE:compatible" \
            "$PAIR_IMAGE@$pair_digest"
          resolved_pair_digest="$(
            docker buildx imagetools inspect "$PAIR_IMAGE:compatible" --raw |
              sha256sum |
              awk '{print "sha256:" $1}'
          )"
          test "$resolved_pair_digest" = "$pair_digest"
          echo "image=$PAIR_IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$pair_digest" >> "$GITHUB_OUTPUT"

      - name: Promote component convenience tags
        env:
          BACKEND_IMAGE: ${{ needs.docker-amd64.outputs.image }}
          FRONTEND_IMAGE: ${{ needs.docker-frontend-amd64.outputs.image }}
          BACKEND_DIGEST: ${{ needs.docker-amd64.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.docker-frontend-amd64.outputs.digest }}
        run: |
          set -eu

          promote_latest() {
            image="$1"
            digest="$2"
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$image:latest" \
              "$image@$digest"
            resolved_digest="$(
              docker buildx imagetools inspect "$image:latest" --raw |
                sha256sum |
                awk '{print "sha256:" $1}'
            )"
            test "$resolved_digest" = "$digest"
          }

          promote_latest "$BACKEND_IMAGE" "$BACKEND_DIGEST"
          promote_latest "$FRONTEND_IMAGE" "$FRONTEND_DIGEST"

      - name: Upload compatibility manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-manifest-${{ github.sha }}
          path: compatibility-manifest.json
          if-no-files-found: error

      - name: Publish compatibility summary
        env:
          BACKEND_IMAGE: ${{ needs.docker-amd64.outputs.image }}
          FRONTEND_IMAGE: ${{ needs.docker-frontend-amd64.outputs.image }}
          BACKEND_DIGEST: ${{ needs.docker-amd64.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.docker-frontend-amd64.outputs.digest }}
          BACKEND_REVISION: ${{ needs.docker-amd64.outputs.revision }}
          FRONTEND_REVISION: ${{ needs.docker-frontend-amd64.outputs.revision }}
          API_CONTRACT_VERSION: ${{ needs.docker-amd64.outputs.contract }}
          PAIR_IMAGE: ${{ steps.publish-pair.outputs.image }}
          PAIR_DIGEST: ${{ steps.publish-pair.outputs.digest }}
        run: |
          {
            echo "## Verified compatible image pair"
            echo
            echo "- Pair revision: \`$GITHUB_SHA\`"
            echo "- Backend: \`$BACKEND_IMAGE@$BACKEND_DIGEST\` (revision \`$BACKEND_REVISION\`)"
            echo "- Frontend: \`$FRONTEND_IMAGE@$FRONTEND_DIGEST\` (revision \`$FRONTEND_REVISION\`)"
            echo "- Pair metadata: \`$PAIR_IMAGE@$PAIR_DIGEST\`"
            echo "- API contract: \`$API_CONTRACT_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

  compatibility-gate:
    name: Compatibility Gate
    needs:
      - classify-image-changes
      - build
      - web
      - db-tests
      - container-smoke
      - docker-amd64
      - docker-frontend-amd64
      - released-pair
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required CI outcomes
        env:
          REF_NAME: ${{ github.ref }}
          CLASSIFY_RESULT: ${{ needs.classify-image-changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WEB_RESULT: ${{ needs.web.result }}
          DB_RESULT: ${{ needs.db-tests.result }}
          CANDIDATE_RESULT: ${{ needs.container-smoke.result }}
          BACKEND_RELEASE_RESULT: ${{ needs.docker-amd64.result }}
          FRONTEND_RELEASE_RESULT: ${{ needs.docker-frontend-amd64.result }}
          RELEASED_PAIR_RESULT: ${{ needs.released-pair.result }}
        run: |
          set -eu
          for result in "$CLASSIFY_RESULT" "$BUILD_RESULT" "$WEB_RESULT" "$DB_RESULT" "$CANDIDATE_RESULT"; do
            test "$result" = success
          done

          if test "$REF_NAME" = refs/heads/main; then
            test "$BACKEND_RELEASE_RESULT" = success
            test "$FRONTEND_RELEASE_RESULT" = success
            test "$RELEASED_PAIR_RESULT" = success
          else
            test "$BACKEND_RELEASE_RESULT" = skipped
            test "$FRONTEND_RELEASE_RESULT" = skipped
            test "$RELEASED_PAIR_RESULT" = skipped
          fi

  docker-arm64:
    name: Docker Build & Push (arm64)
    needs: [compatibility-gate]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.build_arm64 }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}-arm64

      - name: Read API contract version
        id: contract
        run: echo "version=$(python3 -c 'import json; print(json.load(open("contracts/openapi.json"))["info"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            API_CONTRACT_VERSION=${{ steps.contract.outputs.version }}
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
